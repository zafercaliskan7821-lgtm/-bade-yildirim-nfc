<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bade Yıldırım | Acil Durum</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px 12px;font-family:Arial,sans-serif;background:linear-gradient(#fff0f7,#f2f7ff);color:#20243a}
.page{max-width:600px;margin:auto;background:white;border-radius:28px;padding:20px 15px;box-shadow:0 8px 25px #d8a5c533}
header{text-align:center;padding:18px 5px 25px;background:#fff5fa;border-radius:22px}
.decor{font-size:30px}
h1{font-size:clamp(30px,8vw,46px);color:#e72c83;margin:12px 0;text-shadow:2px 3px #ffd2e6}
.subtitle{color:#77546a}
.card{margin:14px 0;padding:17px 12px;border:2px solid #b8dcff;border-radius:22px;background:#f1f8ff;text-align:center}
.card.father{border-color:#f4c6dc;background:#fff2f8}
.label{font-size:25px;font-weight:bold;color:#17477c;margin:0 0 13px}
.father .label{color:#b51e5d}
.call{display:block;padding:14px 7px;border-radius:14px;background:#12a84b;color:white;text-decoration:none;font-size:clamp(18px,5vw,24px);font-weight:bold;box-shadow:0 3px #087c35}
.hint{font-size:13px;margin:10px 0 0}
.notice{display:flex;align-items:center;gap:12px;background:#ffe4ef;border-radius:20px;padding:16px;margin-top:18px;font-weight:bold;line-height:1.4}
.siren{font-size:35px}
footer{text-align:center;border-top:1px solid #eee;margin-top:20px;padding-top:17px}
.brand{font-size:19px;font-weight:bold}
.tag{font-size:14px;margin-top:6px;color:#555}
</style>
</head>
<body>
<main class="page">
<header>
<div class="decor">💕 🦋 💗</div>
<h1>BADE YILDIRIM</h1>
<div class="subtitle">Acil durumda ailesine ulaşın ❤️</div>
</header>

<section class="card">
<h2 class="label">ANNESİ</h2>
<a class="call" href="tel:+905496450515">☎ 0549 645 05 15</a>
<p class="hint">Acil durumda aramak için dokunun.</p>
</section>

<section class="card father">
<h2 class="label">BABASI</h2>
<a class="call" href="tel:+905377210469">☎ 0537 721 04 69</a>
<p class="hint">Acil durumda aramak için dokunun.</p>
</section>

<div class="notice">
<div class="siren">🚨</div>
<div>Acil durumda lütfen yukarıdaki numaralardan ailesine ulaşınız.</div>
</div>

<footer>
<div class="brand">⬡ ÇALIŞKAN 3D TASARIM</div>
<div class="tag">Kişiye özel NFC acil durum etiketi</div>
</footer>
</main>
</body>
</html>
